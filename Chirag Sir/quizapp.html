<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-box {
            max-width: 500px;
            width: 100%;
        }

        .option-btn {
            text-align: left;
            padding: 12px 20px;
        }

        .option-btn.correct {
            background: #198754 !important;
            border-color: #198754 !important;
            color: #fff !important;
        }

        .option-btn.wrong {
            background: #dc3545 !important;
            border-color: #dc3545 !important;
            color: #fff !important;
        }

        .option-btn:disabled {
            opacity: 1;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="quiz-box">

        <!-- WELCOME SCREEN -->
        <div id="start-screen" class="card shadow">
            <div class="card-body text-center p-5">
                <h1 class="mb-3">📝 Quiz App</h1>
                <p class="text-muted mb-2">Test your knowledge!</p>
                <p class="text-muted small mb-4">
                    <strong>Rules:</strong> 10 seconds per question<br>
                    4 options • Select the correct answer
                </p>
                <button class="btn btn-primary btn-lg px-5" onclick="startQuiz()">
                    Start Quiz
                </button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="card shadow hide">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span id="progress">Question 1 / 5</span>
                <span id="timer" class="timer text-danger">⏱ 10s</span>
            </div>
            <div class="card-body">
                <h5 id="question" class="card-title mb-4">Question text here?</h5>
                <div id="options" class="d-grid gap-2">
                    <!-- Options will be inserted here -->
                </div>
            </div>
            <div class="card-footer text-end">
                <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()" disabled>
                    Next →
                </button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="card shadow hide">
            <div class="card-body text-center p-5">
                <h2 class="mb-3">🎉 Quiz Completed!</h2>
                <p class="display-6 mb-3" id="score">You scored 0 / 5</p>
                <p id="message" class="text-muted mb-4">Great job!</p>
                <button class="btn btn-success btn-lg px-5" onclick="restartQuiz()">
                    🔄 Try Again
                </button>
            </div>
        </div>

    </div>

    <script>
        // ========== QUIZ DATA ==========
        const quizData = [
            {
                question: "What is the capital of France?",
                options: ["London", "Berlin", "Paris", "Madrid"],
                answer: 2
            },
            {
                question: "Which planet is closest to the Sun?",
                options: ["Venus", "Mercury", "Mars", "Earth"],
                answer: 1
            },
            {
                question: "What does HTML stand for?",
                options: ["Hyper Text Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlink Text Mode Language"],
                answer: 0
            },
            {
                question: "Which is the largest ocean?",
                options: ["Atlantic", "Indian", "Arctic", "Pacific"],
                answer: 3
            },
            {
                question: "What is 15 × 3?",
                options: ["35", "40", "45", "50"],
                answer: 2
            }
        ];

        // ========== STATE ==========
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 10;
        let timerInterval = null;
        const TIME_LIMIT = 10;

        // ========== DOM ELEMENTS ==========
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const timerEl = document.getElementById('timer');
        const nextBtn = document.getElementById('next-btn');
        const scoreEl = document.getElementById('score');
        const messageEl = document.getElementById('message');

        // ========== FUNCTIONS ==========

        function showScreen(screen) {
            startScreen.classList.add('hide');
            quizScreen.classList.add('hide');
            resultScreen.classList.add('hide');
            screen.classList.remove('hide');
        }

        function startQuiz() {
            currentIndex = 0;
            score = 0;
            showScreen(quizScreen);
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIndex];

            // Update UI
            progressEl.textContent = `Question ${currentIndex + 1} / ${quizData.length}`;
            questionEl.textContent = q.question;
            nextBtn.disabled = true;
            nextBtn.textContent = currentIndex === quizData.length - 1 ? 'Finish' : 'Next →';

            // Create option buttons
            optionsEl.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-primary option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(i);
                optionsEl.appendChild(btn);
            });

            // Start timer
            startTimer();
        }

        function startTimer() {
            timeLeft = TIME_LIMIT;
            updateTimer();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimer() {
            timerEl.textContent = `⏱ ${timeLeft}s`;
            timerEl.className = timeLeft <= 3 ? 'timer text-danger' : 'timer text-success';
        }

        function selectAnswer(selected) {
            clearInterval(timerInterval);
            const correct = quizData[currentIndex].answer;
            const buttons = optionsEl.querySelectorAll('.option-btn');

            // Disable all buttons
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === correct) btn.classList.add('correct');
                if (i === selected && selected !== correct) btn.classList.add('wrong');
            });

            // Update score
            if (selected === correct) score++;

            nextBtn.disabled = false;
        }

        function handleTimeout() {
            const correct = quizData[currentIndex].answer;
            const buttons = optionsEl.querySelectorAll('.option-btn');

            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === correct) btn.classList.add('correct');
            });

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            scoreEl.textContent = `You scored ${score} / ${quizData.length}`;

            // Message based on score
            const percent = (score / quizData.length) * 100;
            if (percent === 100) messageEl.textContent = '🏆 Perfect Score!';
            else if (percent >= 60) messageEl.textContent = '👍 Good job!';
            else messageEl.textContent = '📚 Keep practicing!';

            showScreen(resultScreen);
        }

        function restartQuiz() {
            startQuiz();
        }
    </script>

</body>

</html>
